<!DOCTYPE html>
<html lang="en">
<body>
  <ul id="names"></ul>
  <script>
    fetch("/api/students")
      .then(function (response) { return response.json(); })
      .then(function (names) {
        var list = document.getElementById("names");
        names.forEach(function (name) {
          var item = document.createElement("li");
          item.textContent = name;
          list.appendChild(item);
        });
      });
  </script>
</body>
</html>
