<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Students</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      background: #f7f5f1;
      color: #1d1b18;
    }
    main {
      max-width: 36rem;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin: 0 0 0.4rem;
    }
    h2 {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0 0 0.75rem;
    }
    p {
      margin: 0 0 1.5rem;
      color: #5e584f;
    }
    #averages {
      list-style: none;
      margin: 0 0 2.25rem;
      padding: 0;
    }
    #averages li {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.45rem 0;
      border-bottom: 1px solid #e4dfd6;
    }
    ol {
      margin: 0;
      padding-left: 1.3rem;
    }
    ol li {
      padding: 0.3rem 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Students</h1>
    <p>Placeholder list from the student table.</p>
    <h2>Competency averages</h2>
    <ul id="averages"></ul>
    <ol id="students"></ol>
  </main>
  <script>
    fetch("/api/competencies")
      .then(function (response) { return response.json(); })
      .then(function (averages) {
        var list = document.getElementById("averages");
        averages.forEach(function (competency) {
          var item = document.createElement("li");
          var label = document.createElement("span");
          var score = document.createElement("span");
          label.textContent = competency.label;
          score.textContent = Number(competency.average).toFixed(2);
          item.appendChild(label);
          item.appendChild(score);
          list.appendChild(item);
        });
      });

    fetch("/api/students")
      .then(function (response) { return response.json(); })
      .then(function (students) {
        var list = document.getElementById("students");
        students.forEach(function (student) {
          var item = document.createElement("li");
          item.textContent = student.full_name;
          list.appendChild(item);
        });
      });
  </script>
</body>
</html>
